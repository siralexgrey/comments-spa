<table
  mat-table
  matSort
  matSortDisableClear
  multiTemplateDataRows
  [dataSource]="comments()"
  [matSortActive]="sortBy()"
  [matSortDirection]="sortDir()"
  [trackBy]="trackById"
  (matSortChange)="onSort($event)"
>
  <!-- User Name -->
  <ng-container matColumnDef="userName">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
    <td mat-cell *matCellDef="let c; dataSource: comments()">
      <app-comment-author
        [userName]="c.userName"
        [homePage]="c.homePage"
      />
    </td>
  </ng-container>

  <!-- Email -->
  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
    <td mat-cell *matCellDef="let c; dataSource: comments()" class="secondary">{{ c.email }}</td>
  </ng-container>

  <!-- createdAt -->
  <ng-container matColumnDef="createdAt">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Created at</th>
    <td mat-cell *matCellDef="let c; dataSource: comments()" class="secondary">{{ c.createdAt | date: dateFormat }}</td>
  </ng-container>

  <!-- detail -->
  <ng-container matColumnDef="detail">
    <td mat-cell *matCellDef="let c; dataSource: comments()" class="detail-cell" [attr.colspan]="columns.length">
      <div class="comment-text" [innerHTML]="c.text"></div>
      @if(c.attachment; as attachment){
        <app-comment-attachment class="mt-3 block" [attachment]="attachment" />
      }
      <div class="thread-actions">
        <app-comment-reply-action [commentId]="c.id" />
        <app-comment-replies [replies]="c.replies" />
      </div>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr
    mat-row
    class="comment-row"
    *matRowDef="let row; columns: columns"
  ></tr>
  <tr
    mat-row
    class="detail-row"
    *matRowDef="let row; columns: ['detail']"
  ></tr>
</table>
<mat-paginator
  [length]="totalCount()"
  [pageSize]="pageSize()"
  [pageIndex]="page() - 1"
  (page)="onPageChange($event)"
  [hidePageSize]="true"
  showFirstLastButtons
  aria-label="Comments pages"
/>

@if (replies().length) {
  <button
    class="text-sm text-(--mat-sys-primary) hover:underline cursor-pointer mb-3"
    [attr.aria-expanded]="expanded()"
    (click)="expanded.update(v => !v)"
  >
    {{
      expanded()
        ? 'Hide replies'
        : 'Show ' + replies().length + ' replies'
    }}
  </button>
}
@if (expanded()) {
  <div class="ml-6 border-l pl-4">
    @for (reply of replies(); track reply.id) {
      <div class="mb-3">
        <div
          class="flex flex-wrap items-center gap-3 rounded px-3 py-2 bg-(--mat-sys-surface-container)"
        >
          <app-comment-author
            [userName]="reply.userName"
            [homePage]="reply.homePage"
          />
          <span
            class="text-sm text-(--mat-sys-on-surface-variant)"
          >
            {{ reply.email }}
          </span>
          <span
            class="text-sm text-(--mat-sys-on-surface-variant)"
          >
            {{ reply.createdAt | date: dateFormat }}
          </span>
        </div>
        <div [innerHTML]="reply.text" class="mt-2"></div>
      </div>
      <app-comment-reply-action [commentId]="reply.id" />
      <app-comment-replies [replies]="reply.replies" />
    }
  </div>
}

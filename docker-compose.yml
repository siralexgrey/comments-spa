services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set}
    ports:
      - "127.0.0.1:14330:1433"
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: ./server
    environment:
      ConnectionStrings__Default: "Server=db;Database=Comments;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
      Uploads__Path: /app/uploads
      # Behind nginx: take the client IP from X-Forwarded-For instead of the nginx container IP.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
  uploads-data: